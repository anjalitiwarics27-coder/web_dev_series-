<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Creation </title>
</head>
<body>
    <div>
        <h1> Form </h1>
        <br>
        <br>

        <br>
        <fieldset>
            <legend>Enter your basics details </legend>
        <form action ="WelcomePage.html" target="_blank">
            
            <label for ="fulname">Full name : </label>
            <input type = "text" placeholder ="Enter your name ">
            <br><br>
            <label for ="email" >Email : </label>
            <input type = "email" placeholder="Enter email">
            <br><br>
            <label for = "password">password</label>
            <input type="password"placeholder="Enter passwords ">
            <br><br>
            <label for="checkBox">Are you 18+ ? : </label>
            <input type="checkbox" id=""checkBox>
            <br><br>
            <label for="city">select your city : </label>
            <select name = "" id="city">
                <option value="">Delhi</option>
                <option value="">Mumbai</option>
                <option value="">Noida</option>
                <option value="">Kolkata</option>
                <option value="">Jaipur</option>
            </select>
            <br><br>


            <label for ="phone number ">phone number </label>
            <input type ="number" id=""phoneNumber>
            <br><br>
            <label for ="gender">Gender : </label>
            <label for="male">male</label>
            <input type ="radio" id ="male" name="gender">
            <label for = "female">female</label>
            <input type = "radio" id ="female" name ="gender">
            <br><br>
            <label for = "date">Enter your dob : </label>
            <input type = "date " id ="date">
            <br><br>
            <label for = "file">upload phone : </label>
            <input type="file" id="file">
            <br><br>
            <br><br>
            <button type="submit">submit form </button>
        </form>
        </fieldset>
    </div>
</body>
</html>
