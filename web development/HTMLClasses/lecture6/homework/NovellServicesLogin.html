<!DOCTYPE html>
<html>
<head>
    <title>Novell Services Login</title>
</head>

<body>

    <h1>Novell Services Login</h1>

    <form>

        <label>Username:</label>
        <input type="text">
        <br><br>

        <label>Password:</label>
        <input type="password">
        <br><br>

        <label>City of Employment:</label>
        <input type="text">
        <br><br>

        <label>Web server:</label>
        <select>
            <option>Choose a server</option>
            <option>Server 1</option>
            <option>Server 2</option>
            <option>Server 3</option>
        </select>

        <br><br>

        <label>Please specify your role:</label>
        <br>

        <input type="radio" name="role">
        <label>Admin</label>
        <br>

        <input type="radio" name="role">
        <label>Engineer</label>
        <br>

        <input type="radio" name="role">
        <label>Manager</label>
        <br>

        <input type="radio" name="role">
        <label>Guest</label>

        <br><br>

        <label>Single Sign-on to the following:</label>
        <br>

        <input type="checkbox">
        <label>Mail</label>
        <br>

        <input type="checkbox">
        <label>Payroll</label>
        <br>

        <input type="checkbox">
        <label>Self-service</label>

        <br><br>

        <input type="submit" value="Login">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
