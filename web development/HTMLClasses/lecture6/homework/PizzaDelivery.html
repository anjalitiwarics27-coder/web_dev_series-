<!DOCTYPE html>
<html>
<head>
    <title>Pete's Pizza Delivery</title>
</head>

<body>

    <center>
        <h1>Pete's Pizza Delivery</h1>
        <h2>Online Order Form</h2>
        <p>* required fields</p>
    </center>

    <form>

        <fieldset>
            <legend>Customer details</legend>

            <label>Name:</label>
            <input type="text">
            <br>

            <label>Address:</label>
            <input type="text">
            <br>

            <label>Town/city:</label>
            <input type="text">
            <br>

            <label>Postcode:</label>
            <input type="text">
            <br>

            <label>Tel:</label>
            <input type="text">
            <br>

            <label>Email:</label>
            <input type="email">

        </fieldset>

        <br>

        <fieldset>
            <legend>Topping </legend>

            <input type="radio" name="topping">
            <label>Margherita</label>
            <br>

            <input type="radio" name="topping">
            <label>Four Seasons</label>
            <br>

            <input type="radio" name="topping">
            <label>Meat Feast</label>

        </fieldset>

        <fieldset>
            <legend>Size *</legend>

            <input type="radio" name="size">
            <label>Small</label>
            <br>

            <input type="radio" name="size">
            <label>Medium</label>
            <br>

            <input type="radio" name="size">
            <label>Large</label>

        </fieldset>

        <fieldset>
            <legend>Extras</legend>

            <input type="checkbox">
            <label>Mushrooms</label>
            <br>

            <input type="checkbox">
            <label>Green peppers</label>
            <br>

            <input type="checkbox">
            <label>Anchovies</label>
            <br>

            <input type="checkbox">
            <label>Extra cheese</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>Delivery</legend>

            <label>Preferred delivery time:</label>

            <input type="time">
            <br><br>

            <label>Delivery instructions:</label>
            <br>

            <textarea rows="5" cols="50"></textarea>

        </fieldset>

        <br>

        <center>
            <input type="submit" value="Submit order">
        </center>

    </form>

</body>
</html>
