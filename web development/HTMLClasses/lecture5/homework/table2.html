<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>
    <style>
        table{
            border: 1px solid black;
            border-collapse: collapse;
        }
        tr,
        td,
        th {
              border: 1px solid black;
              padding: 6px;
              text-align: center;
        }
    </style>
</head>
<body>
    <h1>School Time Table</h1>
    <br>
    <br>
    <br>
    <br>
    <div>

    <div>
        <table>
        
            <tr>
                <th colspan="6">Time Table</th>
            </tr>
            <tr>
                <th rowspan="6">Hours</th>
                <th>Mon</th>
                <th>Tues</th>
                <th>Wed</th>
                <th>Thurs</th>
                <th>Fri</th>
            </tr>
        
        
            <tr>
                
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Arts</td>
            </tr>
            <tr>
                
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Arts</td>
            </tr>
            <tr>
                
                <th colspan="5">lunch</th>
                
            </tr>
            <tr>
                
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td rowspan="2">Project</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                
            </tr>
        
        
    </table>
    </div>
    
</body>
</html>
