<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>
    <style>
        table,
        tr,
        td,
        th {
              border: 1px solid black;
              border-collapse:collapse;
        }
    </style>
</head>
<body>
    <h1>School Time Table</h1>
    <table>
        <thead>
            <tr>
                <th colspan="6">Time Table</th>
            </tr>
            <tr>
                <th>Mon</th>
                <th>Tues</th>
                <th>Wed</th>
                <th>Thrus</th>
                <th>Fri</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td></td>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Arts</td>
            </tr>
            <tr>
                <td></td>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Arts</td>
            </tr>
            <tr>
                <th rowspan="7">hours</th>
                
                <th colspan="5">lunch</th>
                
            </tr>
            <tr>
                
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td rowspan="2">Project</td>
            </tr>
            <tr>
            
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td></td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>
    
</body>
</html>
